name: Deploy Sky's Adventure to GitHub Pages

# NOTE: this workflow assumes `final_project/` is the ROOT of the git
# repository you push to GitHub. If instead you keep the whole course
# workspace as one repo with final_project as a sub-folder, either:
#   1) move this file to <repo-root>/.github/workflows/deploy.yml and
#      prefix every `working-directory` below with `final_project/`, or
#   2) create a separate repo containing only this folder's contents.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
